name: Publish compiled release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft Release tag, for example v0.1.0
        required: true
        type: string
permissions:
  contents: write
  packages: write
concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Validate stable tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 -c 'import os,re; assert re.fullmatch(r"v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)", os.environ["RELEASE_TAG"]), "Stable vX.Y.Z tag required"'
      - name: Download precompiled draft Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern app.tar.gz --dir /tmp/dnd-release
      - name: Verify compiled payload and version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 tools/publish-validate.py /tmp/dnd-release/app.tar.gz . "$RELEASE_TAG"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image name
        id: name
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - name: Build and publish immutable image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.name.outputs.image }}
          labels: org.opencontainers.image.version=${{ inputs.tag }}
          provenance: mode=min
          sbom: true
      - name: Write release manifest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 tools/publish-manifest.py "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$IMAGE_DIGEST" release.json
      - name: Package public installer distribution
        run: tar -czf /tmp/dnd-release/dnd-ai-arahort.tar.gz install.sh Dockerfile compose.yaml compose.http.yaml compose.https.yaml compose.local.yaml .dockerignore .env.example release-source.json README.md LICENSE ops docs
      - name: Attach manifest and installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release upload "$RELEASE_TAG" release.json /tmp/dnd-release/dnd-ai-arahort.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
